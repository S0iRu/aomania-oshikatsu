name: save-memo

on:
  repository_dispatch:
    types: [save-memo]

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const raw = context.payload.client_payload && context.payload.client_payload.manual
            if (!raw || typeof raw !== 'object') {
              core.setFailed('メモの形式が違います')
              return
            }
            function asList(value, max) {
              if (!Array.isArray(value) || value.length > max) throw new Error('invalid')
              return value
            }
            const manual = {
              deadlines: asList(raw.deadlines, 100).map((item) => {
                if (!item || typeof item.id !== 'string' || typeof item.title !== 'string' || typeof item.at !== 'string') {
                  throw new Error('invalid')
                }
                if (item.id.length > 80 || item.title.length > 200 || item.at.length > 40) throw new Error('invalid')
                return { id: item.id, title: item.title, at: item.at }
              }),
              hiddenIds: asList(raw.hiddenIds || [], 500).map((id) => {
                if (typeof id !== 'string' || id.length > 80) throw new Error('invalid')
                return id
              }),
              thumbnailOverrides: raw.thumbnailOverrides && typeof raw.thumbnailOverrides === 'object' ? raw.thumbnailOverrides : {},
              extraStreams: asList(raw.extraStreams || [], 100),
            }
            const path = 'public/data/manual.json'
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: 'main',
            })
            if (Array.isArray(data) || !data.sha) {
              core.setFailed('メモのファイルがありません')
              return
            }
            const content = Buffer.from(JSON.stringify(manual, null, 2) + '\n').toString('base64')
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'メモを更新',
              content,
              sha: data.sha,
              branch: 'main',
            })
